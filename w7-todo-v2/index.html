<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo 列表 V2.0 数据驱动版</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111;
      --muted: #666;
      --line: #cfcfcf;
      --surface: #fff;
      --bg: #f5f5f5;
      --accent: #111;
      --done: #ececec;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 18px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.6;
    }

    .app-shell {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 28px;
      background: var(--surface);
      border: 1px solid #222;
      border-radius: 4px;
    }

    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 8px; }
    .intro { color: var(--muted); }

    .todo-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      margin: 22px 0 14px;
    }

    label { font-weight: 700; }
    input {
      width: 100%;
      min-width: 0;
      margin-top: 6px;
      padding: 11px 12px;
      border: 1px solid #777;
      border-radius: 3px;
      font: inherit;
    }

    button {
      align-self: end;
      padding: 11px 16px;
      border: 0;
      border-radius: 3px;
      color: #fff;
      background: var(--accent);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #333; }
    button:focus-visible { outline: 2px solid #777; outline-offset: 2px; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .filters button { color: var(--ink); background: #eee; }
    .filters button[aria-pressed="true"] { color: #fff; background: var(--accent); }
    .list-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .hint { color: var(--muted); font-size: .9rem; }
    .todo-list {
      display: grid;
      gap: 8px;
      min-height: 48px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      background: #fafafa;
    }
    .todo-item.is-done { background: var(--done); color: var(--muted); }
    .todo-text { flex: 1; overflow-wrap: anywhere; cursor: pointer; }
    .todo-text.is-done { text-decoration: line-through; }
    .delete-button { padding: 3px 8px; color: #fff; background: #555; }
    .empty { color: var(--muted); }

    @media (max-width: 540px) {
      body { padding: 18px 12px; }
      .app-shell { padding: 22px 18px; }
      .todo-form { grid-template-columns: 1fr; }
      .todo-form button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <h1>Todo 列表 V2.0</h1>
    <p class="intro">状态统一由 todos 数组管理，页面是数据的可重复生成结果。</p>

    <form class="todo-form" id="todo-form">
      <label for="todo-input">
        Todo 内容
        <input id="todo-input" type="text" placeholder="例如：完成实验报告" autocomplete="off">
      </label>
      <button type="submit">添加 Todo</button>
    </form>

    <section aria-labelledby="list-title">
      <div class="list-heading">
        <h2 id="list-title">我的 Todo</h2>
        <span class="hint" id="count-hint">共 0 项</span>
      </div>
      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'w7-todos';
    const form = document.querySelector('#todo-form');
    const input = document.querySelector('#todo-input');
    const list = document.querySelector('#todo-list');
    const countHint = document.querySelector('#count-hint');
    const filterButtons = [...document.querySelectorAll('[data-filter]')];
    const clearCompletedButton = document.querySelector('#clear-completed');

    let todos = load();
    let filter = 'all';

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function load() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw === null) return [];
      try {
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function render() {
      list.innerHTML = '';
      const shown = todos;
      countHint.textContent = `共 ${todos.length} 项，当前显示 ${shown.length} 项`;

      if (shown.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = '当前筛选下没有 Todo';
        list.appendChild(empty);
      }

      shown.forEach((todo) => {
        const li = document.createElement('li');
        li.className = `todo-item${todo.completed ? ' is-done' : ''}`;

        const text = document.createElement('span');
        text.className = `todo-text${todo.completed ? ' is-done' : ''}`;
        text.textContent = todo.text;
        text.addEventListener('click', () => toggleTodo(todo.id));

        const deleteButton = document.createElement('button');
        deleteButton.className = 'delete-button';
        deleteButton.type = 'button';
        deleteButton.textContent = '删除';
        deleteButton.addEventListener('click', () => removeTodo(todo.id));

        li.append(text, deleteButton);
        list.appendChild(li);
      });

    }

    function addTodo(text) {
      const cleanText = String(text).trim();
      if (cleanText === '') return;
      const todo = { id: Date.now(), text: cleanText, completed: false };
      todos = [...todos, todo];
      save();
      render();
    }

    function removeTodo(id) {
      todos = todos.filter((todo) => todo.id !== id);
      save();
      render();
    }

    function toggleTodo(id) {
      todos = todos.map((todo) => (
        todo.id === id ? { ...todo, completed: !todo.completed } : todo
      ));
      save();
      render();
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      addTodo(input.value);
      input.value = '';
      input.focus();
    });

    render();
  </script>
</body>
</html>
